services:
  postgres:
    image: postgres:16-alpine
    container_name: aipcc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: aipcc
    ports:
      - "5432:5432"
    volumes:
      - aipcc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d aipcc"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aipcc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - aipcc-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aipcc-postgres-data:
  aipcc-redis-data:
